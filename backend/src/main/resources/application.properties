spring.application.name=finance-tracker-api
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:financetracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}
